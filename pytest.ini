[pytest]
testpaths = tests

# importlib import mode keeps test modules isolated from each other, so the
# same filename can appear in tests/api and tests/ui without the two
# colliding. It does not put the root on sys.path by itself, hence pythonpath.
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --alluredir=allure-results
    --clean-alluredir
pythonpath = .

markers =
    ui: drives a real browser through Playwright
    api: talks to an HTTP API over the network
    unit: exercises test helpers in isolation, no I/O
    smoke: the minimal set that has to pass before anything else runs
